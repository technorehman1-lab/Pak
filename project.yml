name: PakTransfer

options:
  bundleIdPrefix: com.paktransfer
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  PakTransfer:
    type: application
    platform: iOS
    sources:
      - App
      - Models
      - Services
      - Store
      - Views
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paktransfer.app
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Pak Transfer
        INFOPLIST_KEY_NSCameraUsageDescription: QR scan karne ke liye camera chahiye
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
